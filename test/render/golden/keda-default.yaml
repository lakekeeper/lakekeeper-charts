# Source: lakekeeper/templates/optimize/optimize-metrics-service.yaml
# Only inside the cluster: KEDA reads the demand of each size class from the metrics port of the catalog Pods.
apiVersion: v1
kind: Service
metadata:
  name: lk-lakekeeper-metrics
  namespace: lk
  labels:
    helm.sh/chart: <chart>
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/instance: lk
    app.kubernetes.io/version: <app-version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: lakekeeper
    app.kubernetes.io/component: catalog-metrics
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/instance: lk
    app.kubernetes.io/component: catalog
