# Source: lakekeeper/templates/catalog/catalog-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-lakekeeper
  namespace: lk
  labels:
    helm.sh/chart: <chart>
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/instance: lk
    app.kubernetes.io/version: <app-version>
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: lakekeeper
    app.kubernetes.io/component: catalog
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper
      app.kubernetes.io/instance: lk
      app.kubernetes.io/component: catalog
  template:
    metadata:
      annotations:
        checksum/secret-config-envs: <checksum>
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        helm.sh/chart: <chart>
        app.kubernetes.io/name: lakekeeper
        app.kubernetes.io/instance: lk
        app.kubernetes.io/version: <app-version>
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: lakekeeper
        app.kubernetes.io/component: catalog
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      serviceAccountName: lk-lakekeeper
      initContainers:        
        
        - name: check-db  
          image: quay.io/vakamo/lakekeeper-plus:<tag>
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            runAsGroup: 65534
          resources:
            {}
          envFrom:    
            - secretRef:
                name: lk-lakekeeper-config-envs
          env:    
            - name: LAKEKEEPER__PG_HOST_W
              value: lk-lakekeeper-pg
            - name: LAKEKEEPER__PG_PORT
              value: "5432"
            - name: LAKEKEEPER__PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: POSTGRES_DB
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: USERDB_USER
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: USERDB_PASSWORD
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-postgres-encryption
                  key: encryptionKey
            
            - name: LAKEKEEPER__PLACEHOLDER
              value: "placeholder"
          args:
            - wait-for-db
            - -dm
            - -r
            - "100"
            - -b
            - "2"
      containers:
        - name: lakekeeper          
          image: quay.io/vakamo/lakekeeper-plus:<tag>
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            runAsGroup: 65534
          env:            
            - name: LAKEKEEPER__PG_HOST_W
              value: lk-lakekeeper-pg
            - name: LAKEKEEPER__PG_PORT
              value: "5432"
            - name: LAKEKEEPER__PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: POSTGRES_DB
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: USERDB_USER
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-pg
                  key: USERDB_PASSWORD
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-postgres-encryption
                  key: encryptionKey
            
            - name: LAKEKEEPER__PLACEHOLDER
              value: "placeholder"            
            - name: LAKEKEEPER__OPTIMIZE__AVAILABLE
              value: "true"
            - name: LAKEKEEPER__OPTIMIZE__SIZE_CLASSES
              value: "{\"small\":{\"cpu\":\"2\",\"memory\":\"8Gi\"}}"
          envFrom:            
            - secretRef:
                name: lk-lakekeeper-config-envs
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
            - name: metrics
              containerPort: 9000
              protocol: TCP
          args:
            - serve
          livenessProbe:
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: 8181
          readinessProbe:
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: 8181
          resources:
            {}
