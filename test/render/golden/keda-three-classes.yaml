              - name: LAKEKEEPER__OPTIMIZE__SIZE_CLASS
                value: small
              - name: LAKEKEEPER__OPTIMIZE__SPILL_DISK_LIMIT_BYTES
                value: "2415919104"
              - name: TMPDIR
                value: /tmp
              - name: HTTPS_PROXY
