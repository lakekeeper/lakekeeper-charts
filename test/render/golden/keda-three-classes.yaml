                name: s3-credentials
          env:    
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: postgresql-password
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lk-lakekeeper-postgres-encryption
                  key: encryptionKey
            - name: HTTPS_PROXY
              value: http://proxy.example:3128
            
