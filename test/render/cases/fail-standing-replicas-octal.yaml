# expect: optimizeWorkers.sizeClasses small: standing.replicas must be a whole number of at least 1.
# `int` would read "010" as 8.
lakekeeper:
  edition: plus
  useLicenseSecret: false
optimizeWorkers:
  enabled: true
  mode: standing
  sizeClasses:
    - name: small
      resources: { cpu: "1", memory: 4Gi }
      standing: { replicas: "010" }
