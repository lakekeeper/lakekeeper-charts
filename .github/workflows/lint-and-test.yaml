name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
        with:
            version: v3.14.0

      - name: Add groundhog2k helm repo
        run: helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/

      - name: Add openfga helm repo
        run: helm repo add openfga https://openfga.github.io/helm-charts

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for any chart file changes
        id: chart-files-changed
        run: |
          changed=$(git diff --name-only origin/${{ github.event.repository.default_branch }}...HEAD -- charts/)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --check-version-increment=false

      - name: Test KV2 secret mount rendering
        if: steps.chart-files-changed.outputs.changed == 'true'
        run: |
          secret_mount='my/custom/kv/path'
          encoded_secret_mount=$(printf '%s' "$secret_mount" | base64 | tr -d '\n')
          helm dependency build charts/lakekeeper
          helm template issue-1918 charts/lakekeeper \
            --show-only templates/config/secret-config-envs.yaml \
            --set secretBackend.type=KV2 \
            --set-string secretBackend.kv2.secretMount="$secret_mount" \
            | grep -F "LAKEKEEPER__KV2__SECRET_MOUNT: \"$encoded_secret_mount\""

      - name: Create kind cluster
        if: steps.chart-files-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        if: steps.chart-files-changed.outputs.changed == 'true'
        run: ct install --all --target-branch ${{ github.event.repository.default_branch }} --helm-extra-set-args "--set lakekeeper.licenseKey=${{ secrets.LAKEKEEPER_PLUS_LICENSE_KEY }}"
